name: calendario2
description: Calendario 3.0.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.0.2+53
environment:
  sdk: '>=3.13.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

# UI
  cupertino_icons: ^2.0.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^9.0.0
#  flutter_datetime_picker: ^1.5.1
  flex_color_picker: ^4.0.0
  flutter_slidable: ^4.0.3
  image_fade: ^0.6.2
  introduction_screen: ^5.0.1


# ESTADO
  flutter_riverpod: ^3.4.3

# ADS Y CONTROL
  google_mobile_ads: ^9.1.0
#  sentry_flutter: ^7.4.2

# CALENDARIO
  table_calendar: ^3.3.0
  flutter_local_notifications: ^22.3.2
#  flutter_native_timezone: ^2.0.0


  # DATA
  shared_preferences: ^2.5.6
  get_storage: ^2.1.1
  sqflite: ^2.4.4+2
  path_provider: ^2.1.6
  file_picker: ^13.1.0


# FUNCIONALIDADES APP
  tutorial_coach_mark: ^1.3.4
  share_plus: ^13.3.1
  cross_file: ^0.3.5+2
  pdf: ^3.11.3
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.2

# UTIL
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  flutter_file_dialog: ^3.3.3


  # TODO PENDIENTE DE BUSCAR OTRA OPCION ESTABLE
  modal_bottom_sheet:
    git:
      url: https://github.com/bayysp/modal_bottom_sheet.git
      path: modal_bottom_sheet
      ref: 3.0.0-pre+1-idn_version


  open_filex: ^5.0.0
  clipboard: ^3.0.14
  logger: ^2.5.0
  path: ^1.9.1
  intl: ^0.20.2


  firebase_core: ^5.0.0
#  firebase_remote_config: ^3.0.15
  firebase_messaging: ^17.0.0
  go_router: ^18.1.0
  sqflite_common_ffi_web: ^1.2.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#FF9800"
  adaptive_icon_foreground: "assets/icon/icon.png"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 19 # min sdk del icono; Android de la app se define en build.gradle
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "FF9800FF"
    theme_color: "FF9800FF"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/iconos/
    - assets/images/_common/icons/
    - assets/images/tutorial/
    - assets/animaciones/
    - assets/logos/
    - assets/other/


