name: calendario2
description: Calendario 2.0.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.1.1+41

environment:
  sdk: '>=2.19.3 <3.0.0'


dependencies:
  flutter:
    sdk: flutter

# UI
  cupertino_icons: ^1.0.5
  flutter_screenutil: ^5.8.1
  google_fonts: ^4.0.4
#  flutter_datetime_picker: ^1.5.1
  flutter_datetime_picker_plus: ^2.0.1
  flex_color_picker: ^3.2.2
  flutter_slidable: ^3.0.0
  flutter_animated_dialog: 2.0.1
  image_fade: ^0.6.2
  rive: ^0.11.2
  introduction_screen: ^3.1.8


# ESTADO
  get: ^4.6.5

# ADS Y CONTROL
  google_mobile_ads: ^3.0.0
  mixpanel_flutter: ^2.1.1
#  sentry_flutter: ^7.4.2

# CALENDARIO
  table_calendar: ^3.0.9
  flutter_local_notifications: ^14.1.0
  flutter_timezone:
#  flutter_native_timezone: ^2.0.0


  # DATA
  shared_preferences: ^2.1.1
  get_storage: ^2.1.1
  sqflite: ^2.2.8+4
  path_provider: ^2.0.15
  file_picker: ^5.2.0


# FUNCIONALIDADES APP
  tutorial_coach_mark: ^1.2.8
  share_plus: ^6.3.0
  url_launcher: ^6.1.11
  youtube_player_iframe: ^4.0.4

# UTIL
  permission_handler: ^10.2.0
  flutter_markdown: ^0.6.14
  package_info_plus: ^3.0.0
  device_info_plus: ^8.0.2
  flutter_file_dialog: ^3.0.1


  # TODO PENDIENTE DE BUSCAR OTRA OPCION ESTABLE
  modal_bottom_sheet:
    git:
      url: https://github.com/bayysp/modal_bottom_sheet.git
      path: modal_bottom_sheet
      ref: 3.0.0-pre+1-idn_version


  rename: ^2.1.1



  dio: ^5.1.2
  dart_big5: ^0.0.5
  open_filex: ^4.3.2
  clipboard: ^0.1.3
  alice_lightweight: ^3.3.0 # restricted by dio 4.0.6


  firebase_core: ^2.13.0
  firebase_analytics: ^10.4.1
  firebase_crashlytics: ^3.3.1
#  firebase_remote_config: ^3.0.15
  firebase_messaging: ^14.6.1
  cloud_firestore: ^4.7.1
  firebase_auth: ^4.6.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#FF9800"
  adaptive_icon_foreground: "assets/icon/icon.png"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 19 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "FF9800FF"
    theme_color: "FF9800FF"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/iconos/
    - assets/images/_common/icons/
    - assets/images/tutorial/
    - assets/animaciones/
    - assets/logos/
    - assets/other/


