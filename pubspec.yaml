name: calendario2
description: A new Flutter calendar with Getx.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=2.19.3 <3.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5

#  table_calendar_sandamil: 1.0.0
  table_calendar: ^3.0.9


  # for state management and context less stuff
  get: ^4.6.5

  # log events in clear way insted of (print)
  logger: ^1.3.0

  flutter_screenutil: ^5.7.0

  flutter_slidable: ^2.0.0
  jiffy: ^5.0.1

  # local database (SQFlite replacement)
  hive: ^2.2.3
  # make it easy to use hive (no need for path provider)
  hive_flutter: ^1.1.0
  # shared preferences persistence key value store
  shared_preferences: ^2.1.0
  sqflite: ^2.2.6
  path_provider: ^2.0.14
  flutter_datetime_picker: ^1.5.1

  flutter_material_color_picker: ^1.1.0+2
  flex_color_picker: ^3.1.0

  google_fonts: ^3.0.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/other/

