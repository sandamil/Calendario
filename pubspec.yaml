name: calendario2
description: Calendario 2.0.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.1+31

environment:
  sdk: '>=2.19.3 <3.0.0'


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_screenutil: ^5.7.0
  google_fonts: ^4.0.4
  get: ^4.6.5

  mixpanel_flutter: ^2.1.1
#  sentry_flutter: ^7.4.2

  google_mobile_ads: ^3.0.0



  table_calendar: ^3.0.9

  shared_preferences: ^2.1.1
  get_storage: ^2.1.1

  sqflite: ^2.2.8+2
  path_provider: ^2.0.15

  alarm: ^1.0.5
#    path: /Users/imac/StudioProjects/alarm

  flutter_datetime_picker: ^1.5.1

  flex_color_picker: ^3.2.1

  flutter_slidable: ^3.0.0

  #  Todo  añadir animaciones a los dialogos

  flutter_animated_dialog: 2.0.1

  url_launcher: ^6.1.11
  youtube_player_iframe: ^4.0.4
  image_fade: ^0.6.2

  rive: ^0.10.4

  rename: ^2.1.1

  permission_handler:
  package_info_plus: ^4.0.0
  tutorial_coach_mark: ^1.2.8
  modal_bottom_sheet:
    git:
      url: https://github.com/bayysp/modal_bottom_sheet.git
      path: modal_bottom_sheet
      ref: 3.0.0-pre+1-idn_version




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1
  flutter_launcher_icons: "^0.13.1"


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  adaptive_icon_background: "FF9800FF"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 19 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "FF9800FF"
    theme_color: "FF9800FF"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/iconos/
    - assets/images/_common/icons/
    - assets/images/tutorial/
    - assets/animaciones/
    - assets/alarmas/
    - assets/logos/
    - assets/other/

